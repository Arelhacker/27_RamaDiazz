<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Daftar — MABARLAH</title>
<link rel="stylesheet" href="shared.css"/>
<style>
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:6rem 1rem 4rem;position:relative;z-index:1}
.auth-page::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 40%,rgba(0,229,255,.04) 0%,transparent 70%);pointer-events:none}

.auth-card{width:100%;max-width:460px;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;overflow:hidden;animation:cardIn .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}

.auth-top{padding:2.5rem 2.5rem 1.5rem;text-align:center;background:linear-gradient(180deg,rgba(0,229,255,.04),transparent);border-bottom:1px solid var(--border)}
.auth-logo{font-family:'Orbitron',monospace;font-size:1.4rem;font-weight:900;color:var(--gold);display:flex;align-items:center;justify-content:center;gap:.5rem;text-decoration:none;margin-bottom:.8rem}
.auth-logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--gold),var(--gold2));clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);display:flex;align-items:center;justify-content:center;font-size:.9rem;color:#000;font-weight:900}
.auth-title{font-family:'Orbitron',monospace;font-size:1.1rem;font-weight:700;color:var(--text);margin-bottom:.3rem}
.auth-subtitle{font-size:.82rem;color:var(--muted);font-family:'Rajdhani',sans-serif;letter-spacing:.04em}

.auth-body{padding:2rem 2.5rem 2.5rem}

.form-msg{padding:.65rem 1rem;border-radius:var(--radius);font-size:.82rem;font-family:'Rajdhani',sans-serif;font-weight:600;margin-bottom:1rem;display:none}
.form-msg.error{background:rgba(255,45,85,.1);border:1px solid rgba(255,45,85,.3);color:var(--red);display:block}
.form-msg.success{background:rgba(0,255,136,.1);border:1px solid rgba(0,255,136,.3);color:var(--green);display:block}

.form-group{margin-bottom:1.1rem}
.form-label{display:block;font-family:'Rajdhani',sans-serif;font-weight:600;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:.45rem}
.form-input{width:100%;padding:.85rem 1rem;background:rgba(255,255,255,.04);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-family:'Exo 2',sans-serif;font-size:.95rem;outline:none;transition:border-color .2s,background .2s}
.form-input:focus{border-color:var(--cyan);background:rgba(0,229,255,.02)}
.form-input::placeholder{color:var(--muted);opacity:.6}

.btn-auth{width:100%;padding:.9rem;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;font-family:'Orbitron',monospace;font-weight:700;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;border:none;border-radius:var(--radius);cursor:pointer;transition:all .3s;margin-top:.3rem}
.btn-auth:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(245,197,24,.3)}
.btn-auth:active{transform:translateY(0)}

.auth-footer{text-align:center;margin-top:1.4rem;font-size:.82rem;color:var(--muted);font-family:'Rajdhani',sans-serif;line-height:1.9}
.auth-footer a{color:var(--gold);text-decoration:none;font-weight:600}
.auth-footer a:hover{text-decoration:underline}

.divider{display:flex;align-items:center;gap:1rem;margin:1.2rem 0;color:var(--muted);font-size:.75rem;font-family:'Rajdhani',sans-serif;letter-spacing:.1em}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}

.perks{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:1.5rem}
.perk{display:flex;align-items:center;gap:.4rem;font-size:.75rem;color:var(--muted);font-family:'Rajdhani',sans-serif}
.perk::before{content:'✓';color:var(--green);font-weight:700;flex-shrink:0}
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-orb bg-orb1"></div>
<div class="bg-orb bg-orb2"></div>
<div class="bg-orb bg-orb3"></div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- NAV -->
<nav>
  <div class="nav-inner">
    <a class="logo" href="index.html"><div class="logo-icon">⚡</div>MABARLAH</a>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html#joki">Joki Rank</a></li>
      <li><a href="index.html#topup">Top Up</a></li>
      <li><a href="index.html#cara">Cara Order</a></li>
      <li><a href="index.html#testi">Testimoni</a></li>
    </ul>
    <div class="nav-right" id="navRight">
      <a class="btn-nav btn-login" href="login/index.html">Masuk</a>
      <a class="btn-nav btn-register" href="register.html">Daftar</a>
    </div>
    <button class="menu-toggle" id="menuToggle">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<!-- REGISTER PAGE -->
<main class="auth-page">
  <div class="auth-card">
    <div class="auth-top">
      <a class="auth-logo" href="index.html">
        <div class="auth-logo-icon">⚡</div>
        MABARLAH
      </a>
      <div class="auth-title">Buat Akun Gratis</div>
      <div class="auth-subtitle">Bergabung & mulai order joki atau top up sekarang</div>
    </div>
    <div class="auth-body">
      <div class="perks">
        <div class="perk">Daftar gratis</div>
        <div class="perk">Order langsung</div>
        <div class="perk">Riwayat pesanan</div>
        <div class="perk">Support 24/7</div>
      </div>
      <div class="form-msg" id="registerMsg"></div>
      <div class="form-group">
        <label class="form-label" for="regName">Nama Lengkap</label>
        <input class="form-input" id="regName" type="text" placeholder="Nama kamu" autocomplete="name"/>
      </div>
      <div class="form-group">
        <label class="form-label" for="regUser">Username</label>
        <input class="form-input" id="regUser" type="text" placeholder="Username unik" autocomplete="username"/>
      </div>
      <div class="form-group">
        <label class="form-label" for="regGmail">Gmail</label>
        <input class="form-input" id="regGmail" type="email" placeholder="contoh@gmail.com" autocomplete="email"/>
      </div>
      <div class="form-group">
        <label class="form-label" for="regPass">Password</label>
        <input class="form-input" id="regPass" type="password" placeholder="Min. 6 karakter" autocomplete="new-password"/>
      </div>
      <button class="btn-auth" onclick="doRegister()">Buat Akun →</button>
      <div class="divider">sudah punya akun?</div>
      <div class="auth-footer">
        <a href="login/index.html">Masuk sekarang</a><br>
        <a href="index.html">← Kembali ke Beranda</a>
      </div>
    </div>
  </div>
</main>

<script src="register.js"></script>
</body>
</html>
